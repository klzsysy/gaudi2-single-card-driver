<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">Gaudi2 OAM to working HPU</title>
  <desc id="desc">Conceptual bring-up stages on the documented adapter setup: PCIe enumeration, patched-driver initialization with identity IOMMU mapping, and compute validation. This is not a wiring diagram.</desc>
  <rect width="1200" height="350" rx="12" fill="#101820"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="56" y="48" font-size="20" fill="#f0b86e" font-weight="600" text-anchor="start">GAUDI2 HL-225 / HARDWARE BRING-UP</text>
    <text x="1144" y="48" font-size="20" fill="#a5b4c5" font-weight="400" text-anchor="end">UBUNTU · 1.24.1</text>
    <text x="56" y="117" font-size="56" fill="#f0f6fc" font-weight="650" text-anchor="start">From OAM to a working HPU.</text>
    <text x="56" y="159" font-size="25" fill="#a5b4c5" font-weight="400" text-anchor="start">Adapter setup · driver patches · documented compute checks</text>
    <line x1="56" y1="200" x2="360" y2="200" stroke="#f0b86e" stroke-width="2"/>
    <text x="56" y="239" font-size="23" fill="#f0b86e" font-weight="600" text-anchor="start">01</text>
    <text x="106" y="239" font-size="28" fill="#f0f6fc" font-weight="600" text-anchor="start">Enumerate</text>
    <text x="56" y="280" font-size="22" fill="#a5b4c5" font-weight="400" text-anchor="start">OAM → PCIe adapter</text>
    <line x1="448" y1="200" x2="752" y2="200" stroke="#f0b86e" stroke-width="2"/>
    <text x="448" y="239" font-size="23" fill="#f0b86e" font-weight="600" text-anchor="start">02</text>
    <text x="498" y="239" font-size="28" fill="#f0f6fc" font-weight="600" text-anchor="start">Initialize</text>
    <text x="448" y="280" font-size="22" fill="#a5b4c5" font-weight="400" text-anchor="start">Patched driver + identity</text>
    <line x1="840" y1="200" x2="1144" y2="200" stroke="#f0b86e" stroke-width="2"/>
    <text x="840" y="239" font-size="23" fill="#f0b86e" font-weight="600" text-anchor="start">03</text>
    <text x="890" y="239" font-size="28" fill="#f0f6fc" font-weight="600" text-anchor="start">Validate</text>
    <text x="840" y="280" font-size="22" fill="#a5b4c5" font-weight="400" text-anchor="start">Matmul + forward/backward</text>
    <text x="56" y="324" font-size="20" fill="#a5b4c5" font-weight="400" text-anchor="start">Conceptual sequence · inspect power, seating, and IOMMU before device acquisition</text>
  </g>
</svg>
